# Servicio IA + Redis (caché del /estimate y caché del turno 1 de las sesiones)
# + Postgres con pgvector (presupuestos históricos troceados y sus embeddings).
# Uso: cp .env.example .env  (con tus claves)  y  docker compose up --build
# Swagger en http://localhost:8000/docs. Streamlit corre fuera, contra este puerto.

name: estimador-cag

services:
  api:
    build: .
    image: estimador-cag-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Dentro de la red de compose Redis se llama "redis", no localhost.
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://estimator:estimator@postgres:5432/estimator
      # Logs en JSON aunque el .env local diga development.
      APP_ENV: production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # Postgres 16 con la extensión vector precompilada (se activa con CREATE EXTENSION).
    image: pgvector/pgvector:pg16
    environment:
      # Credenciales de desarrollo local, no secretos.
      POSTGRES_DB: estimator
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
