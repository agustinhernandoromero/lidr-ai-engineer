[project]
name = "estimador-cag"
version = "0.2.0"
description = "FastAPI Software Estimation Service with versioned Jinja2 prompts and a typed client contract"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "anthropic>=0.28.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
    "jinja2>=3.1.4",
    "structlog>=24.1.0",
    "requests>=2.32.0",
    "redis>=5.0.0",
    "google-genai>=1.0.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
    # Sesión 08. [asyncio] trae greenlet, que SQLAlchemy 2.1 ya no instala solo.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    # Sesión 10: reranker cross-encoder (arrastra PyTorch).
    "sentence-transformers==6.2.0",
    # Session 11: generation quality evaluation (4 RAGAS metrics).
    "ragas==0.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fakeredis>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: llama a la API real de Anthropic; solo corre con RUN_LIVE_TESTS=1",
    "db: usa el Postgres + pgvector de docker compose; solo corre con RUN_DB_TESTS=1",
]

[tool.uv]
# Dependencias indirectas de sentence-transformers fijadas a versiones con más de
# dos semanas de antigüedad (resolución con tope 2026-10-22). Subir a propósito.
constraint-dependencies = [
    "torch==2.14.1",
    "transformers==5.20.2",
    "huggingface-hub==2.2.0",
    "hf-xet==1.7.0",
    "filelock==4.2.4",
    "threadpoolctl==3.7.0",
    # Session 11: ragas indirect dependencies published less than two weeks before
    # 2026-11-14, pinned to the previous release (resolution capped at 2026-10-31).
    "datasets==5.1.0",
    "jsonpatch==1.38",
    "jsonpointer==3.6",
    "langchain==1.4.7",
    "langchain-core==1.7.3",
    "langchain-openai==1.7.3",
    "langchain-protocol==0.0.20",
    "langgraph==1.2.19",
    "langgraph-checkpoint==4.3.1",
    "langgraph-prebuilt==1.1.1",
    "langgraph-sdk==0.4.11",
    "langsmith==0.14.16",
    "ormsgpack==1.13.0",
    "xxhash==4.0.2",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2.
    "langchain-community==0.4.1",
    "mypy-extensions==1.1.0",
]
